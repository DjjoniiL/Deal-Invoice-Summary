<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/_gw/icon">
    <link rel="stylesheet" href="/styles.css">
    <title>Счета по сделкам</title>
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <h1>Счета по сделкам</h1>
          <p id="portal">Подключение к порталу...</p>
        </div>
        <button id="refresh" class="icon-button" title="Обновить">↻</button>
      </section>

      <section class="grid">
        <form id="settings" class="panel">
          <div class="panel-title">
            <h2>Поля сделки</h2>
            <button type="button" id="ensureFields">Создать поля</button>
          </div>
          <label>Сумма выставленных счетов<select name="issuedField"></select></label>
          <label>Сумма оплаченных счетов<select name="paidField"></select></label>
          <label>Сумма неоплаченных счетов<select name="unpaidField"></select></label>
          <label>Остаток оплаты<select name="remainingField"></select></label>
          <label class="check"><input type="checkbox" name="includeNegativeStages"> Учитывать отрицательные стадии</label>
          <button type="submit">Сохранить настройки</button>
        </form>

        <section class="panel">
          <h2>Пересчёт</h2>
          <form id="dealForm" class="row">
            <input name="dealId" inputmode="numeric" placeholder="ID сделки">
            <button>Пересчитать сделку</button>
          </form>
          <button id="recent">Пересчитать счета за 30 дней</button>
          <pre id="result">Готово к работе.</pre>
        </section>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
